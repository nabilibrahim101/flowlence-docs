site_name: Flowlence Learn
site_url: https://learn.flowlence.com
site_description: Tutorials and guides for Flowlence Code - Block-based coding for the Brilliant IoT Smart City Workshop
site_author: Flowlence

theme:
  name: material
  custom_dir: overrides
  # logo: images/logo.png       # Uncomment when you add a logo file
  # favicon: images/favicon.png # Uncomment when you add a favicon file
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap
  - stylesheets/tokens.css
  - stylesheets/chrome.css
  - stylesheets/home.css
  - stylesheets/pillars.css
  - stylesheets/content.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/download-toast.js

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

# Project-first navigation: each Part is one workshop project.
# Within each project, components are introduced first, then the build capstone ties them together.
# This mirrors how the workshop coach guides students: learn the pieces, then build the system.
nav:
  - Home: index.md

  - Part 1 · Getting Started:
    - getting-started/index.md
    - What is IoT & a Smart City?: getting-started/what-is-iot.md
    - Meet Your Kit: getting-started/meet-your-kit.md
    - Install Flowlence Code: getting-started/install.md
    - Tour the Interface: getting-started/interface.md
    - How Blocks Work: getting-started/block-basics.md
    - Pin Map & Shield Layout: getting-started/pin-map.md
    - Your First Program: getting-started/first-program.md

  - Part 2 · Smart Agriculture:
    - projects/agriculture/index.md
    - White LED: projects/agriculture/led.md
    - Soil Moisture Probe: projects/agriculture/soil-moisture.md
    - Water Level Detector: projects/agriculture/water-level.md
    - Water Pump (with Relay): projects/agriculture/water-pump.md
    - Build the Smart Agriculture System: projects/agriculture/build.md

  - Part 3 · Smart Parking:
    - projects/parking/index.md
    - Distance Sensor (Ultrasonic): projects/parking/ultrasonic.md
    - Servo Motor: projects/parking/servo.md
    - RFID Reader: projects/parking/rfid.md
    - Build the Smart Parking System: projects/parking/build.md

  - Part 4 · Smart Safety:
    - projects/safety/index.md
    - Fire Detector: projects/safety/fire-detector.md
    - Gas Leak Sensor: projects/safety/gas-leak.md
    - Active Buzzer: projects/safety/active-buzzer.md
    - Build the Smart Safety System: projects/safety/build.md

  - Part 5 · Smart Temperature:
    - projects/temperature/index.md
    - Temperature & Humidity (DHT11): projects/temperature/dht11.md
    - DC Motor (Fan): projects/temperature/dc-motor.md
    - LCD Display: projects/temperature/lcd.md
    - Build the Smart Temperature System: projects/temperature/build.md

  - Reference:
    - reference/index.md
    - Glossary: reference/glossary.md
    - Troubleshooting: reference/troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nabilibrahim101
    - icon: fontawesome/solid/globe
      link: https://flowlence.com

